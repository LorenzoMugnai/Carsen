services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  carsen-alpha:
    build: .
    image: carsen-mcp:latest
    command: ["serve", "--config", "/configs/alpha.yaml", "--transport", "http"]
    ports:
      - "8765:8765"
    volumes:
      - ./configs/examples/docker-alpha.yaml:/configs/alpha.yaml:ro
      - ./example-workspace:/workspace:ro
      - carsen_alpha_data:/data/carsen/alpha
    depends_on:
      - qdrant

  carsen-beta:
    image: carsen-mcp:latest
    command: ["serve", "--config", "/configs/beta.yaml", "--transport", "http"]
    ports:
      - "8766:8766"
    volumes:
      - ./configs/examples/docker-beta.yaml:/configs/beta.yaml:ro
      - ./example-workspace:/workspace:ro
      - carsen_beta_data:/data/carsen/beta
    depends_on:
      - qdrant

volumes:
  qdrant_data:
  carsen_alpha_data:
  carsen_beta_data:
