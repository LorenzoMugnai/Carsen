[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carsen-mcp"
version = "0.1.0"
description = "Carsen MCP code skeleton"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "qdrant-client>=1.10",
  "mcp>=1.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "docling>=2.0",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=11.0",
]

[project.scripts]
carsen = "carsen_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/carsen_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "model: optional tests that may download or load real embedding/reranking models",
  "smoke: optional operational smoke tests for local deployments",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["carsen_mcp"]
ignore_missing_imports = true
warn_unused_ignores = true
no_strict_optional = false
check_untyped_defs = true
