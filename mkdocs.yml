site_name: Carsen
site_description: Local-first MCP knowledge engine for indexed code and document collections.
repo_url: https://github.com/LorenzoMugnai/Carsen
repo_name: LorenzoMugnai/Carsen

theme:
  name: material
  logo: assets/logo_character.png
  favicon: assets/logo_character.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LorenzoMugnai/Carsen
      name: Carsen on GitHub

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  superpowers/**

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Connect to an LLM: llm-integration.md
      - Academic users: academic-users.md
  - Core concepts:
      - Overview: concepts.md
      - MCP: concepts/mcp.md
      - Qdrant: concepts/qdrant.md
      - Embeddings: concepts/embeddings.md
      - Chunks and citations: concepts/chunks-and-citations.md
  - Using Carsen:
      - Configuration: configuration.md
      - Knowledge instances: knowledge-instances.md
      - Indexing: indexing.md
      - Retrieval: retrieval.md
      - Citations: citations.md
      - MCP server: mcp.md
      - CLI reference: cli-reference.md
  - Operations:
      - Deployment: deployment.md
      - Security: security.md
      - Testing: testing.md
      - Troubleshooting: troubleshooting.md
  - Development:
      - Architecture: architecture.md
      - Contributing: contributing.md
      - Development setup: development.md
      - Extending Carsen: extending.md
      - ADRs:
          - Separate knowledge instances: adr/0001-separate-knowledge-instances.md
          - Qdrant per-instance collections: adr/0002-qdrant-per-instance-collections.md
          - Canonical chunk store: adr/0003-canonical-chunk-store.md
          - Hybrid retrieval: adr/0004-hybrid-dense-sparse-retrieval.md
          - Metadata-backed citations: adr/0005-metadata-backed-citations.md
          - Generative LLM independence: adr/0006-generative-llm-independence.md
