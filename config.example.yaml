knowledge:
  id: example
  name: Example Knowledge Base
  description: Example Carsen knowledge instance.

server:
  transport: http
  host: 127.0.0.1
  port: 8765

storage:
  qdrant_url: http://127.0.0.1:6333
  # qdrant_path overrides qdrant_url and uses embedded local Qdrant storage.
  # Use this when Docker or a Qdrant server is unavailable.
  # qdrant_path: "${HOME}/.local/share/carsen/example/qdrant"
  collection: kb_example
  data_directory: "${HOME}/.local/share/carsen/example"
  # Optional Qdrant performance knobs for large collections. Defaults keep
  # behaviour unchanged. Changing quantization or the on_disk options only takes
  # effect after 'carsen reembed' recreates the collection.
  tuning:
    # Query-time HNSW search breadth. Higher = more accurate, slower. Unset = Qdrant default.
    hnsw_ef: null
    # Compress stored vectors: 'scalar' (int8, ~4x smaller, tiny accuracy loss)
    # or 'binary' (~32x smaller, needs rescore). Unset = full-precision vectors.
    quantization: null
    quantization_always_ram: true
    # With quantization: re-score shortlisted candidates against full vectors.
    rescore: true
    oversampling: 2.0
    # Keep vectors / payload on disk instead of in RAM (larger-than-memory collections).
    on_disk_vectors: false
    on_disk_payload: false

models:
  embedding:
    provider: sentence_transformers
    model: Qwen/Qwen3-Embedding-0.6B
    dimensions: 1024
    device: auto
    batch_size: 8
    max_seq_length: 1024
    # Prepended to search queries only (not to indexed documents). Asymmetric
    # retrieval models such as Qwen3-Embedding expect a task prefix on the query:
    # query_instruction: "Instruct: Given a question, retrieve relevant code and documentation\nQuery: "
    # Remote endpoint instead of a local model (OpenAI, Ollama, TEI, Infinity):
    # provider: openai_compatible
    # model: bge-m3
    # dimensions: 1024
    # base_url: http://127.0.0.1:8080/v1
    # api_key_env: EMBEDDINGS_API_KEY
    # timeout: 30
  reranker:
    # Used only when retrieval.rerank is true. The sentence_transformers provider
    # expects a genuine cross-encoder checkpoint (e.g. BAAI/bge-reranker-v2-m3).
    provider: sentence_transformers
    model: BAAI/bge-reranker-v2-m3
    device: auto

retrieval:
  # Set dense_candidates to 0 for sparse/exact-only operation.
  # This avoids loading embedding models during search and works without GPU/Qdrant.
  dense_candidates: 40
  sparse_candidates: 40
  fused_candidates: 30
  final_results: 8
  fusion: rrf
  max_results_per_source: 3
  # Rerank fused candidates with models.reranker before returning results.
  # Off by default: it loads a cross-encoder model on first search.
  rerank: false

indexing:
  incremental: true
  follow_symlinks: false
  watch: false
  watch_debounce_seconds: 10.0
  watch_embed: false

parsing:
  documents:
    ocr: false
    table_structure: false
    force_backend_text: true
  # Split parser chunks larger than this many tokens into overlapping pieces
  # (approx 4 chars/token). Set to null to keep whole parser chunks.
  max_chunk_tokens: 1200
  chunk_overlap_tokens: 100

sources:
  # Local source example:
  # code:
  #   - path: /path/to/local/repo
  #     repository_name: org/repo
  # Remote public Git sources are cloned into this instance's data_directory/remotes cache.
  # If repo_url and path are both set, repo_url takes precedence.
  # code:
  #   - repo_url: https://github.com/org/repo.git
  #     ref: main
  #     subpath: src
  #     repository_name: org/repo
  code: []
  documents: []

policy:
  allow_external_llm: false
